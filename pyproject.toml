[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "arbor-network-manager"
version = "0.1.0"
description = "Provider-neutral Arbor network state and route planning"
requires-python = ">=3.11"

[project.scripts]
arbor-networkd = "arbor_network_manager.daemon:main"
arbor-network-provider-lan = "arbor_network_manager.providers:lan_main"
arbor-network-provider-ygg = "arbor_network_manager.providers:ygg_main"
